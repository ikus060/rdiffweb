image: python:3.13-trixie

variables:
  MINARCA_DEV_REMOTE_URL: https://minarca-dev.ikus-soft.com
  MINARCA_DEV_USERNAME: admin
  MINARCA_DEV_PASSWORD: admin123

stages:
  - test
  - package
  - doc
  - test-package
  - sonar
  - publish
  - upload
  - deploy
  - e2e-test

.dist_matrix: &dist_matrix
  - DIST: [trixie, forky]
  # Disable selenium test in ubuntu - because snap chronium is not working in docker
  - DIST: [resolute, stonking]
    RDIFFWEB_SELENIUM_TEST: 0

.stable_debian: &stable_debian trixie

check-new-series:
  stage: .pre
  allow_failure: true
  image: buildpack-deps:stable
  script:
    # Check if the latest version is configure in this CICD pipeline
    - apt -yU install distro-info
    - LATEST_UBUNTU=$(ubuntu-distro-info --supported | tail -n 1)
    - LATEST_DEBIAN=$(debian-distro-info --supported | grep -vE '(sid|experimental)' | tail -n 1)
    - echo "Latest Ubuntu supported:$LATEST_UBUNTU"
    - grep -qE "DIST:.*$LATEST_UBUNTU" .gitlab-ci.yml
    - echo "Latest Debian supported:$LATEST_DEBIAN"
    - grep -qE "DIST:.*$LATEST_DEBIAN" .gitlab-ci.yml

.apt-minarca-source: &apt-minarca-source
  - wget -O /etc/apt/keyrings/minarca-keyring.asc https://www.ikus-soft.com/archive/minarca/public.key
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/minarca-keyring.asc] https://nexus.ikus-soft.com/repository/apt-dev-$DIST/ $DIST-dev main" > /etc/apt/sources.list.d/minarca.list
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/minarca-keyring.asc] https://nexus.ikus-soft.com/repository/apt-release-$DIST/ $DIST main" >> /etc/apt/sources.list.d/minarca.list
  - apt update

#
# Test Stage
#
.tox: &tox
  stage: test
  variables:
    TOXENV: $CI_JOB_NAME
  before_script:
    - apt-get -yq update
    - apt-get install -yq rdiff-backup
  script:
    - pip install tox
    - export TOXENV=${TOXENV:-$CI_JOB_NAME}
    - echo TOXENV=$TOXENV
    - ulimit -n 4096
    - tox
  artifacts:
    paths:
      - coverage-*.xml
      - xunit-*.xml
    expire_in: 1 day

lint:
  <<: *tox

py3:
  <<: *tox
  parallel: 3
  variables:
    TOXENV: "py3"
    PYTEST_SPLITS: $CI_NODE_TOTAL
    PYTEST_GROUP: $CI_NODE_INDEX

minarca:
  <<: *tox

selenium:
  <<: *tox
  parallel: 3
  variables:
    TOXENV: "selenium"
    PYTEST_SPLITS: $CI_NODE_TOTAL
    PYTEST_GROUP: $CI_NODE_INDEX
  before_script:
    - apt update
    - apt -y --no-install-recommends install xvfb xauth chromium-driver rdiff-backup
  artifacts:
    paths:
      - coverage.xml
      - xunit.xml

wrap-and-sort:
  stage: test
  image: buildpack-deps:stable
  script:
  - apt update
  - apt -y --no-install-recommends install devscripts python3-debian
  - CHANGES=$(wrap-and-sort -astN)
  - if [[ ! -z "$CHANGES" ]]; then echo "$CHANGES"; exit 1; fi

postgresql-12:
  <<: *tox
  services:
    - postgres:16
  parallel: 3
  variables:
    TOXENV: *stable_debian
    PYTEST_SPLITS: $CI_NODE_TOTAL
    PYTEST_GROUP: $CI_NODE_INDEX
    RDIFFWEB_TEST_DATABASE_URI: "postgresql://admin@postgres/test"
    POSTGRES_DB: test
    POSTGRES_USER: admin
    POSTGRES_PASSWORD: ""
    POSTGRES_HOST_AUTH_METHOD: trust

doc:
  <<: *tox
  stage: doc
  needs: []
  dependencies: []
  artifacts:
    paths:
      - .tox/doc/tmp/html
    expire_in: 1 day

package:py3:
  stage: package
  needs: []
  script:
    - pip3 install wheel build
    - python -m build
  dependencies: []
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: 1 day

package:rdiffweb:dsc:
  stage: package
  needs: []
  image: buildpack-deps:unstable
  variables:
    GIT_DEPTH: 50  # GitLab runner will fetch last 50 commits
  script: 
    - rm -f ../*.debian.tar.xz ../*.orig.tar.xz ../*.dsc
    # Install build dependencies
    - apt -U -y --no-install-recommends install tox
    - apt build-dep -y --no-install-recommends -P nocheck,nodoc .
    # Update changelog with unrelease changes (if required)
    - git config user.email "$GITLAB_USER_EMAIL"
    - git config user.name "$GITLAB_USER_NAME"
    - (tox -e changelog -- --bump "$(setuptools-scm)" && git commit -m "automatic build" CHANGELOG.md debian/changelog) || true
    # Create original tarball ".orig.tar.xz"
    - debian/rules gentarball
    # Build debian source package ".dsc"
    - dpkg-buildpackage -S --no-check-builddeps
    - mkdir -p ./dist/
    - mv ../*.debian.tar.xz ../*.orig.tar.xz ../*.dsc ./dist/
  artifacts:
    paths:
      - ./dist/*

package:rdiffweb:deb:
  stage: package
  needs: 
    - package:rdiffweb:dsc
  image: buildpack-deps:$DIST
  variables:
     GIT_STRATEGY: none  # GitLab runner will NOT clone/fetch repo
  parallel:
    matrix: *dist_matrix
  before_script:
    - *apt-minarca-source
  script: 
    - rm -f *.deb
    # Install build dependencies
    - apt update
    - apt -y --no-install-recommends install lintian
    - dpkg-source -x ./dist/*.dsc builddir/
    - pushd builddir/
    - apt build-dep -y --no-install-recommends .
    # Build debian binary package ".deb"
    - dpkg-buildpackage -b
    - popd
    - lintian --info --display-info --pedantic *.deb ./dist/*.dsc
    - mkdir -p ./dist/$DIST
    - mv *.deb ./dist/$DIST/
  artifacts:
    paths:
      - ./dist/*

package:minarca-server:deb:
  <<: *tox
  # Older image for pyinstaller
  image: python:3.12-bullseye
  stage: package
  needs: []
  variables:
    TOXENV: "pyinstaller"
  artifacts:
    paths:
    - "./dist/*_amd64.deb"
    expire_in: 1 day

.test-package: &test-package
  stage: test-package
  before_script:
    - *apt-minarca-source
  parallel:
    matrix: *dist_matrix

test-package:rdiffweb:
  <<: *test-package
  needs:
    - package:rdiffweb:deb
  script:
    - apt install -y ./dist/$DIST/rdiffweb*.deb
    - rdiffweb --version
    - (/usr/bin/rdiffweb &)
    - timeout 60 bash -c 'until curl --silent http://localhost:8080; do sleep 1; done'

test-package:minarca-server:
  <<: *test-package
  needs:
    - package:minarca-server:deb
  script:
    - apt install -y ./dist/minarca-server_*_amd64.deb
    - /opt/minarca-server/minarca-server --version
    - (/opt/minarca-server/minarca-server --logfile= &)
    - timeout 60 bash -c 'until curl --silent http://localhost:8080; do sleep 1; done'

publish:sonar:
  stage: sonar
  allow_failure: true
  needs: [py3, minarca]
  image: sonarsource/sonar-scanner-cli
  only:
    variables:
      - $SONAR_URL
      - $SONAR_TOKEN
  variables:
    SONAR_PROJECT_BASE_DIR: "${CI_PROJECT_DIR}"
    SONAR_KEY: "$CI_PROJECT_NAME${CI_COMMIT_TAG:+-dev}"
    # Disable git shallow clone
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - sonar-scanner -X
      -Dsonar.python.coverage.reportPaths=coverage-*.xml
      -Dsonar.python.xunit.reportPaths=xunit-*.xml
      -Dsonar.host.url=$SONAR_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.projectKey=$SONAR_KEY
      -Dsonar.projectVersion=$(git describe)
      -Dsonar.qualitygate.wait=True

.publish-docker: &publish-docker
  stage: publish
  image: docker:20
  services:
    - name: docker:20-dind
  only:
    variables:
      - $DOCKER_USR
      - $DOCKER_PWD
  script:
    # Use debian package version as basis for tag
    - echo "$DOCKER_PWD" | docker login -u "$DOCKER_USR" --password-stdin
    - export PACKAGE_VERSION=$(echo "$FILE" | cut -d '_' -f 2)
    - export IMAGE_NAME=ikus060/$PKGAPP
    - export IMAGE_TAG=$(echo "${PACKAGE_VERSION%%-*}" | tr '+' '-')
    - cd "$CWD"
    - echo "$IMAGE_NAME:$IMAGE_TAG"
    - docker build --build-arg PACKAGE_VERSION="$PACKAGE_VERSION" -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    # Push commit-based tag
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    # Push branch name tag
    - docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    - docker push $IMAGE_NAME:$CI_COMMIT_REF_SLUG
    # Push additional tags only for proper release versions (x.y.z)
    - |
      if echo "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        MAJOR=$(echo "$PACKAGE_VERSION" | cut -d. -f1)
        MINOR=$(echo "$PACKAGE_VERSION" | cut -d. -f1,2)
        docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:$MAJOR"
        docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:$MINOR"
        docker push "$IMAGE_NAME:$MAJOR"
        docker push "$IMAGE_NAME:$MINOR"
      fi

publish:rdiffweb:docker:
  <<: *publish-docker
  needs:
    - package:rdiffweb:deb
    - publish:rdiffweb:deb
  variables:
    PKGAPP: rdiffweb
    DIST: *stable_debian
    CWD: .
  before_script:
    - export FILE=$(ls -1 ./dist/$DIST/$PKGAPP*.deb | tail -n 1)

publish:minarca-server:docker:
  <<: *publish-docker
  needs:
    - package:minarca-server:deb
    - publish:minarca-server:deb
  variables:
    PKGAPP: minarca-server
    CWD: minarca-server/docker
  before_script:
    - export FILE=$(ls -1 ./dist/$PKGAPP*.deb | tail -n 1)

.publish-docker-readme: &publish-docker-readme
  stage: publish
  only:
    variables:
      - $DOCKER_USR
      - $DOCKER_PWD
      - $CI_COMMIT_TAG
  image:
    name: chko/docker-pushrm
    entrypoint: ["/bin/sh", "-c"]
  script:
    - /docker-pushrm

publish:rdiffweb:docker-readme:
  <<: *publish-docker-readme
  needs:
    - publish:rdiffweb:docker
  variables:
    DOCKER_USER: $DOCKER_USR
    DOCKER_PASS: $DOCKER_PWD
    PUSHRM_DEBUG: 1
    PUSHRM_SHORT: A web interface to rdiff-backup repositories.
    PUSHRM_TARGET: docker.io/ikus060/rdiffweb
    PUSHRM_FILE: $CI_PROJECT_DIR/README.md

publish:minarca-server:docker-readme:
  <<: *publish-docker-readme
  needs:
    - publish:minarca-server:docker
  variables:
    DOCKER_USER: $DOCKER_USR
    DOCKER_PASS: $DOCKER_PWD
    PUSHRM_DEBUG: 1
    PUSHRM_SHORT: Your open-source, user-friendly data backup solution.
    PUSHRM_TARGET: docker.io/ikus060/minarca-server
    PUSHRM_FILE: $CI_PROJECT_DIR/minarca-server/docker/README.md

.publish-deb: &publish-deb
  stage: publish
  only:
    variables:
      - $NEXUS_USR
      - $NEXUS_PWD
  parallel:
    matrix: *dist_matrix
  before_script:
    - |
      if [[ "$CI_COMMIT_TAG" == *.+([0-9]) ]]; then
        export APT_URL="$NEXUS_URL/repository/apt-release-${DIST}/"
        export APT_DISTRO="${DIST}"
      else
        export APT_URL="$NEXUS_URL/repository/apt-dev-${DIST}/"
        export APT_DISTRO="${DIST}-dev"
      fi

publish:rdiffweb:deb:
  <<: *publish-deb
  needs:
    - package:rdiffweb:deb
  script: |
    set -x
    export FILE=$(ls -1 ./dist/$DIST/$PKGAPP*.deb)
    curl --fail -u "$NEXUS_USR:$NEXUS_PWD" -H "Content-Type: multipart/form-data" --data-binary "@$FILE" "$APT_URL"
    # Because Nexus index get rebuild asynchronously.
    timeout 60 sh -c 'until curl --fail -s "${APT_URL}/dists/${APT_DISTRO}/main/binary-all/Packages" | grep -q "$(basename "$FILE")"; do sleep 1; done'

publish:minarca-server:deb:
  <<: *publish-deb
  needs:
    - package:minarca-server:deb
  script: |
    set -x
    export FILE=$(ls -1 ./dist/$PKGAPP*.deb)
    curl --fail -u "$NEXUS_USR:$NEXUS_PWD" -H "Content-Type: multipart/form-data" --data-binary "@$FILE" "$APT_URL"
    # Because Nexus index get rebuild asynchronously.
    timeout 60 sh -c 'until curl --fail -s "${APT_URL}/dists/${APT_DISTRO}/main/binary-amd64/Packages" | grep -q "$(basename "$FILE")"; do sleep 1; done'

publish:wheel:
  stage: publish
  only:
    variables:
      - $NEXUS_USR
      - $NEXUS_PWD
      - $NEXUS_PYPI_URL
  needs:
    - package:py3
  script: |
    set -x
    # Publish wheel
    pip3 install wheel twine readme_renderer[md] --upgrade
    LANG="C.UTF-8" python3 -m readme_renderer README.md -o /tmp/README.html
    twine upload dist/*.whl dist/*.tar.gz -u $NEXUS_USR -p $NEXUS_PWD --repository-url $NEXUS_PYPI_URL
    if [ ! -z "$CI_COMMIT_TAG" ]; then
      twine upload dist/*.whl dist/*.tar.gz -u $PYPI_USR -p $PYPI_PWD
    fi

publish:doc:
  stage: publish
  only:
    variables:
      - $NEXUS_USR
      - $NEXUS_PWD
      - $NEXUS_URL
  needs:
    - doc
  script: |
    set -x
    # publish to nexus
    pip install setuptools_scm
    export VERSION=$(python3 -m setuptools_scm)
    cd .tox/doc/tmp/html
    find * -type f | while read -r FILE
    do
      curl --fail -u "$NEXUS_USR:$NEXUS_PWD" --upload-file "$FILE" "$NEXUS_URL/repository/archive/rdiffweb/$VERSION/doc/$FILE"
    done

deploy:dev:
  only:
    variables:
      - $GITLAB_ANSIBLE_TOKEN
  allow_failure: True
  needs:
    - package:rdiffweb:deb
    - package:minarca-server:deb
  parallel:
    matrix:
      - PKGAPP: rdiffweb
        TRIGGER: RDIFFWEB_VERSION
        DIST: *stable_debian
      - PKGAPP: minarca-server
        TRIGGER: MINARCA_VERSION
  image: heitormotta/pipeline-trigger:2.9.0
  script: |
    set -e
    set -x
    if ls ./dist/$DIST/$PKGAPP*.deb 2>/dev/null; then
      export FILE=$(ls -1 ./dist/$DIST/$PKGAPP*.deb)
    else
      export FILE=$(ls -1 ./dist/$PKGAPP*.deb)
    fi
    export DEB_VERSION=$(echo "$FILE" | cut -d '_' -f 2)
    echo DEB_VERSION=$DEB_VERSION
    # Trigger ansible-config pipeline
    trigger -a "$ANSIBLE_PIPELINE_GITLAB_API_TOKEN" -t master -e "$TRIGGER=$DEB_VERSION" -p 36bae86778d901fc6b2d6453a41844 18716492
  stage: deploy
  variables:
    GIT_STRATEGY: none

e2e-test:minarca:deb:
  allow_failure: True
  variables:
    GIT_STRATEGY: none
    DIST: *stable_debian
  needs:
  - deploy:dev
  image: buildpack-deps:$DIST
  script:
    # Install latest minarca-client release
    - apt update
    - apt install -y apt-transport-https ca-certificates lsb-release gpg
    - curl -L https://www.ikus-soft.com/archive/minarca/public.key | gpg --dearmor > /usr/share/keyrings/minarca-keyring.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/minarca-keyring.gpg] https://nexus.ikus-soft.com/repository/apt-dev-$(lsb_release -sc)/ $(lsb_release -sc)-dev main" > /etc/apt/sources.list.d/minarca.list
    - apt update
    - apt install -y minarca-client
    # Smoke test
    - minarca --version
    - /opt/minarca/minarcaw --version
    # Check backup
    - minarca -d link --remoteurl "$MINARCA_DEV_REMOTE_URL" --username "$MINARCA_DEV_USERNAME" --password "$MINARCA_DEV_PASSWORD" --name "e2e-test-${DIST}-${CI_JOB_ID}"
    - minarca -d status
    - minarca -d include /etc /var /home
    - minarca -d backup --force
  stage: e2e-test

e2e-test:minarca:linux:
  allow_failure: 
  variables:
    GIT_STRATEGY: none
  needs:
  - deploy:dev
  image: buildpack-deps:jammy
  script:
    # Install latest minarca-client release
    - apt update
    - apt install -y cron openssh-client locales locales-all
    - wget https://www.ikus-soft.com/archive/minarca/minarca-client-latest.tar.gz
    - tar -zxvf ./minarca-client-latest.tar.gz --strip 1
    # Smoke test
    - ./minarca --version
    - ./minarcaw --version
    # Check backup
    - ./minarca -d link --remoteurl "$MINARCA_DEV_REMOTE_URL" --username "$MINARCA_DEV_USERNAME" --password "$MINARCA_DEV_PASSWORD" --name "e2e-test-linux-${CI_JOB_ID}"
    - ./minarca -d include /etc /var /home
    - ./minarca -d status
    - ./minarca -d backup --force
  stage: e2e-test

e2e-test:minarca:macos:
  allow_failure: True
  variables:
    GIT_STRATEGY: none
  needs:
  - deploy:dev
  before_script:
  - rm -Rf /Applications/Minarca.app
  - rm -Rf $HOME/Library/Preferences/Minarca
  script:
  # Install latest minarca-client release
  - "[ ! -e /Volumes/Minarca ] || hdiutil detach /Volumes/Minarca"
  - curl -L -O https://www.ikus-soft.com/archive/minarca/minarca-client-latest.dmg
  - hdiutil attach ./minarca-client-latest.dmg
  - cp -r /Volumes/Minarca/Minarca.app /Applications/
  # Smoke test
  - /Applications/Minarca.app/Contents/MacOS/minarca --version
  - /Applications/Minarca.app/Contents/MacOS/minarcaw --version
  # Check backup
  - /Applications/Minarca.app/Contents/MacOS/minarca -d forget --force
  - /Applications/Minarca.app/Contents/MacOS/minarca -d link --remoteurl "$MINARCA_DEV_REMOTE_URL" --username "$MINARCA_DEV_USERNAME" --password "$MINARCA_DEV_PASSWORD" --name "e2e-test-macos-${CI_JOB_ID}"
  - /Applications/Minarca.app/Contents/MacOS/minarca -d include "$HOME/Documents"
  - /Applications/Minarca.app/Contents/MacOS/minarca -d status
  - /Applications/Minarca.app/Contents/MacOS/minarca -d backup --force
  stage: e2e-test
  tags:
  - macos
  variables:
    LC_ALL: "en_US.UTF-8"

e2e-test:minarca:win32:
  allow_failure: True
  variables:
    GIT_STRATEGY: none
  needs:
  - deploy:dev
  script:
  # Install minarca
  - Invoke-WebRequest -Uri https://www.ikus-soft.com/archive/minarca/minarca-client-latest.exe -OutFile minarca-client-latest.exe
  - Start-Process -wait "minarca-client-latest.exe" /S
  - dir "C:\Program Files\Minarca"
  - $Env:path = "C:\Program Files\Minarca;$Env:path"
  - $Env:path
  # Smoke test
  - minarca.exe --version
  - minarcaw.exe --version
  # Check backup
  - minarca.exe -d forget --force
  - minarca.exe -d link --force --remoteurl "$MINARCA_DEV_REMOTE_URL" --username "$MINARCA_DEV_USERNAME" --password "$MINARCA_DEV_PASSWORD" --name "e2e-test-win32-${CI_JOB_ID}"
  - minarca.exe -d include /etc /var /home
  - minarca.exe -d status
  - minarca.exe -d backup --force
  stage: e2e-test
  tags:
  - windows

.e2e-test-docker: &e2e-test-docker
  image: docker:20
  stage: e2e-test
  variables:
    GIT_STRATEGY: none
  services:
    - docker:dind
  script:
    - docker run ikus060/$PKGAPP:$CI_COMMIT_SHORT_SHA "$PKGAPP" --version
    - docker run --privileged --name $PKGAPP -p 8080:8080 ikus060/$PKGAPP:$CI_COMMIT_SHORT_SHA &
    - timeout 60 sh -c 'until docker inspect --format="{{.State.Running}}" $PKGAPP 2>/dev/null | grep -q "true" && wget --spider http://docker:8080 2>/dev/null; do sleep 1; done'
    - docker ps

e2e-test:rdiffweb:docker:
  <<: *e2e-test-docker
  variables:
    PKGAPP: rdiffweb
  needs:
    - publish:rdiffweb:docker

e2e-test:minarca-server:docker:
  <<: *e2e-test-docker
  variables:
    PKGAPP: minarca-server
  needs:
    - publish:minarca-server:docker
